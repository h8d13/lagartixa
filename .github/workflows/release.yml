name: release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat version)
          TAG=$(git rev-parse --short HEAD)
          REV=$(gh release list --json tagName -q "[.[] | select(.tagName | startswith(\"$VER-\"))] | length")
          REV=$((REV + 1))
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "REV=$REV" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create release archive
        run: |
          tar -czf ${{ env.VER }}-${{ env.REV }}-${{ env.TAG }}.tar.gz \
            klartix.sh default.conf bootstrap/ src/ LICENSE README.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}-${{ env.REV }}-${{ env.TAG }}
          name: ${{ env.VER }}-${{ env.REV }}-${{ env.TAG }}
          files: ${{ env.VER }}-${{ env.REV }}-${{ env.TAG }}.tar.gz
