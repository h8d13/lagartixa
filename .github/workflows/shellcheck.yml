name: shellcheck

on:
  push:
    paths:
      - '**.sh'
      - '**.conf'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck on scripts
        run: shellcheck --severity=warning *.sh artix-bootstrap/*.sh src/*.sh

      - name: Run shellcheck on conf
        run: shellcheck --shell=bash --severity=warning *.conf
