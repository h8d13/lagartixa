name: shellcheck

on:
  push:
    paths:
      - '**.sh'
      - '**.conf'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck on scripts
        run: |
          shellcheck --severity=warning *.sh artix-bootstrap/*.sh
          shfiles=$(find src -type f 2>/dev/null)
          [ -n "$shfiles" ] && shellcheck --severity=warning $shfiles || true

      - name: Run shellcheck on conf
        run: shellcheck --shell=bash --severity=warning *.conf

      - name: Install shfmt
        run: |
          curl -sSL "https://github.com/mvdan/sh/releases/latest/download/shfmt_$(curl -sSL https://api.github.com/repos/mvdan/sh/releases/latest | grep tag_name | cut -d'"' -f4)_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Check formatting with shfmt
        run: |
          shfmt -i 0 -l *.sh artix-bootstrap/*.sh
          shfiles=$(find src -type f 2>/dev/null)
          [ -n "$shfiles" ] && shfmt -i 0 -l $shfiles || true
