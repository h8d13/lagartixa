name: shellcheck

on:
  push:
    paths:
      - '**.sh'
      - '**.conf'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gather src files
        run: echo "SRC_FILES=$(find src -type f 2>/dev/null | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Run shellcheck on scripts
        run: |
          shellcheck --severity=warning *.sh bootstrap/*.sh
          [ -n "$SRC_FILES" ] && shellcheck --severity=warning $SRC_FILES || true

      - name: Run shellcheck on conf
        run: shellcheck --shell=bash --severity=warning *.conf

      - name: Install shfmt
        run: |
          curl -sSL "https://github.com/mvdan/sh/releases/latest/download/shfmt_$(curl -sSL https://api.github.com/repos/mvdan/sh/releases/latest | grep tag_name | cut -d'"' -f4)_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Check formatting with shfmt
        run: |
          shfmt -i 0 -l *.sh bootstrap/*.sh
          [ -n "$SRC_FILES" ] && shfmt -i 0 -l $SRC_FILES || true
